[platformio]
default_envs = esp32dev
src_dir = main

[env:esp32dev]
platform = espressif32
board = esp32dev
board_build.flash_size = 4MB
board_upload.flash_size = 4MB
framework = espidf
monitor_speed = 115200
upload_speed = 460800
upload_port = /dev/cu.usbserial-0001
monitor_port = /dev/cu.usbserial-0001
